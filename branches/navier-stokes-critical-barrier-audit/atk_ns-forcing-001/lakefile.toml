name = "millennium_audit"
version = "0.1.0"
defaultTargets = ["MillenniumAudit"]

[[lean_lib]]
name = "MillenniumAudit"
srcDir = "."

[[lean_lib]]
name = "OpenMath"
srcDir = "."
roots = ["open_math"]
globs = ["open_math.+"]

[[lean_lib]]
name = "Audit"
srcDir = "."
roots = ["audit"]
globs = ["audit.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

